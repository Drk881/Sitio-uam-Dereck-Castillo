<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">UAM</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="eventos.html">Eventos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="registro.html">Registro</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  

  <div class="container my-5">
    <h1 class="text-primary text-center mb-4">Formulario de registro para conferencias</h1>
    <form id="registroForm" class="p-4 bg-light border rounded shadow-sm">
      
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre completo</label>
        <input type="text" class="form-control" id="nombre" required>
      </div>
  
      <div class="mb-3">
        <label for="correo" class="form-label">Correo institucional</label>
        <input type="email" class="form-control" id="correo" required>
      </div>
  
      <div class="mb-3">
        <label for="carrera" class="form-label">Carrera</label>
        <input type="text" class="form-control" id="carrera" required>
      </div>
  
      <div class="mb-3">
        <label class="form-label">Conferencias a las que desea asistir</label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="conferencias" value="github" id="github">
          <label class="form-check-label" for="github">Uso de GitHub</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="conferencias" value="docker" id="docker">
          <label class="form-check-label" for="docker">Introducción a Docker</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="conferencias" value="linux" id="linux">
          <label class="form-check-label" for="linux">Configuración de servidores Linux</label>
        </div>
      </div>
  
      <button type="submit" class="btn btn-primary">Registrarse</button>
      <p id="mensaje" class="mt-3"></p>
    </form>
  </div>
  

  <script src="script.js"></script>
</body>
<footer>
    <p>Página hecha por Dereck Castillo</p>
</footer>
</html>
